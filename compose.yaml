name: menu-review-stack
services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: menu_review
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer -d menu_review"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["menu-data:/var/lib/postgresql/data"]
  app:
    build: .
    ports: ["127.0.0.1:8780:8080"]
    environment:
      DATABASE_URL: postgres://reviewer:local-demo-only@db:5432/menu_review?sslmode=disable
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-local-review-only-change-me}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
  test-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: [test]
    environment:
      POSTGRES_DB: menu_review_test
      POSTGRES_USER: reviewer
      POSTGRES_PASSWORD: local-test-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewer -d menu_review_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    image: golang:1.27.3-bookworm@sha256:d9b6a1beb9474adc2a1ce842573639b44b2a0dd49b6669f51d3821baf9ec37c9
    profiles: [test]
    working_dir: /work
    volumes: ["./server:/work", "go-modules:/go/pkg/mod", "go-build:/root/.cache/go-build"]
    environment:
      TEST_DATABASE_URL: postgres://reviewer:local-test-only@test-db:5432/menu_review_test?sslmode=disable
    depends_on:
      test-db: {condition: service_healthy}
    command: ["go", "test", "-race", "-count=1", "-v", "./..."]
volumes:
  menu-data:
  go-modules:
  go-build:
