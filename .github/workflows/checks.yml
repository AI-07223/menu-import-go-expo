name: Verify stack sample
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Go race tests with real PostgreSQL
        run: docker compose --profile test run --rm test
      - name: Build Go and Expo with TypeScript checks and client tests
        run: docker compose build app
      - name: Start complete application
        run: docker compose up -d app
      - name: Verify application health
        run: curl --fail --retry 10 --retry-all-errors --retry-delay 2 --retry-max-time 30 --max-time 5 http://localhost:8780/healthz
      - name: Show startup logs on failure
        if: failure()
        run: docker compose logs --no-color app db
      - name: Stop isolated services
        if: always()
        run: docker compose --profile test down
